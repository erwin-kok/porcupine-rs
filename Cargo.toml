[package]
name = "porcupine-rs"
version = "0.3.0"
edition = "2024"
description = "A fast linearizability checker"
license = "MIT"

[dependencies]
criterion = "0.8.2"
crossbeam = "0.8.4"
paste = "1.0.15"
rand = "0.10.1"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "etcd_jepsen"
harness = false

[[bench]]
name = "kv_log"
harness = false
